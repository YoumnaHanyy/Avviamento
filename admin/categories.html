<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Categories | Avviamento</title>

    <link rel="stylesheet" href="admin.css">

    <style>

        /* ==========================================
           HEADER
        ========================================== */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .page-header p {
            color: #667085;
            margin-top: 6px;
        }

        .add-btn {
            background: #073642;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .add-btn:hover {
            background: #0b4653;
            transform: translateY(-1px);
        }


        /* ==========================================
           SEARCH
        ========================================== */

        .search-box {
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            max-width: 500px;
            padding: 14px 16px;
            border: 1px solid #d9dee3;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        .search-box input:focus {
            border-color: #073642;
        }


        /* ==========================================
           CATEGORY ROW
        ========================================== */

        .category-row {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 22px;
            border-bottom: 1px solid #e9ecef;
        }

        .category-row:last-child {
            border-bottom: none;
        }

        .category-image {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            overflow: hidden;
            background: #f0f1f2;
            flex-shrink: 0;
        }

        .category-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .no-image {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 12px;
        }

        .category-info {
            flex: 1;
            min-width: 150px;
        }

        .category-info h3 {
            margin-bottom: 7px;
            font-size: 21px;
        }

        .category-info p {
            color: #667085;
            line-height: 1.5;
        }

        .active-badge {
            color: #16803c;
            font-weight: 700;
        }

        .inactive-badge {
            color: #999;
            font-weight: 700;
        }


        /* ==========================================
           ACTIONS
        ========================================== */

        .category-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .category-actions button {
            padding: 10px 15px;
            border: 1px solid #d9dee3;
            background: white;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .category-actions button:hover {
            background: #f5f7f8;
        }

        .category-actions .delete-category-btn {
            color: #c0392b;
            border-color: #f1c7c2;
            background: #fff7f6;
        }

        .category-actions .delete-category-btn:hover {
            background: #fdebea;
        }


        /* ==========================================
           MODAL
        ========================================== */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 600px;
            max-height: 92vh;
            overflow-y: auto;
            border-radius: 14px;
            padding: 30px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 26px;
        }

        .close-modal {
            border: none;
            background: none;
            font-size: 30px;
            cursor: pointer;
            color: #555;
        }


        /* ==========================================
           FORM
        ========================================== */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d9dee3;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #073642;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }


        /* ==========================================
           CATEGORY IMAGE MANAGEMENT
        ========================================== */

        .category-image-section {
            margin-top: 25px;
            margin-bottom: 25px;
        }

        .category-image-section h3 {
            margin-bottom: 8px;
        }

        .image-note {
            color: #777;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .current-category-image {
            width: 180px;
            border: 1px solid #dfe4e7;
            border-radius: 10px;
            overflow: hidden;
            background: #f8f9fa;
            margin-bottom: 15px;
        }

        .current-category-image img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .current-image-actions {
            padding: 10px;
            background: white;
        }

        .delete-category-image-btn {
            width: 100%;
            padding: 9px;
            border: 1px solid #f1c7c2;
            background: #fff7f6;
            color: #c0392b;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        .delete-category-image-btn:hover {
            background: #fdebea;
        }

        .no-current-image {
            padding: 25px;
            border: 1px dashed #d5dadd;
            border-radius: 9px;
            text-align: center;
            color: #888;
            margin-bottom: 15px;
        }

        .new-image-preview {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            border: 1px solid #dfe4e7;
        }


        /* ==========================================
           FORM ACTIONS
        ========================================== */

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .cancel-btn,
        .save-btn {
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .cancel-btn {
            border: 1px solid #d9dee3;
            background: white;
        }

        .save-btn {
            border: none;
            background: #073642;
            color: white;
        }

        .save-btn:hover {
            background: #0b4653;
        }

        .error-message {
            color: #c0392b;
            font-size: 14px;
            margin-top: 10px;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 700px) {

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .add-btn {
                width: 100%;
            }

            .category-row {
                flex-wrap: wrap;
                padding: 18px 10px;
            }

            .category-image {
                width: 85px;
                height: 85px;
            }

            .category-info {
                min-width: calc(100% - 110px);
            }

            .category-actions {
                width: 100%;
            }

            .category-actions button {
                flex: 1;
            }

            .modal {
                padding: 8px;
            }

            .modal-content {
                padding: 20px;
                max-height: 95vh;
                border-radius: 10px;
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .form-actions button {
                width: 100%;
            }

        }

    </style>

</head>


<body>

<div class="admin-layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            AVVIAMENTO
        </div>

        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="categories.html" class="active">
                Categories
            </a>

            <a href="orders.html">
                Orders
            </a>

            <a href="customers.html">
                Customers
            </a>

            <a href="loyalty.html">
                Loyalty
            </a>
            
<a href="contact-messages.html">Contact Messages</a>


        </nav>

        <button
            id="logoutBtn"
            class="logout-btn">

            Logout

        </button>

    </aside>


    <!-- Main -->

    <main class="main-content">

        <header class="page-header">

            <div>

                <h1>Categories</h1>

                <p>
                    Manage your product categories
                </p>

            </div>

            <button
                id="addCategoryBtn"
                class="add-btn">

                + Add Category

            </button>

        </header>


        <!-- Search -->

        <div class="search-box">

            <input
                type="text"
                id="categorySearch"
                placeholder="Search categories..."
            >

        </div>


        <!-- Categories -->

        <section class="dashboard-section">

            <div id="categoriesContainer">

                <p class="loading-text">
                    Loading categories...
                </p>

            </div>

        </section>

    </main>

</div>


<!-- Category Modal -->

<div
    id="categoryModal"
    class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">
                Add Category
            </h2>

            <button
                id="closeModalBtn"
                class="close-modal"
                type="button">

                ×

            </button>

        </div>


        <form id="categoryForm">

            <input
                type="hidden"
                id="categoryId"
            >


            <!-- Name -->

            <div class="form-group">

                <label for="categoryName">
                    Category Name
                </label>

                <input
                    type="text"
                    id="categoryName"
                    required
                >

            </div>


            <!-- Description -->

            <div class="form-group">

                <label for="categoryDescription">
                    Description
                </label>

                <textarea
                    id="categoryDescription"></textarea>

            </div>


            <!-- Image -->

            <div class="category-image-section">

                <h3>
                    Category Image
                </h3>

                <p class="image-note">
                    You can upload a new image or delete the current one.
                </p>


                <div
                    id="currentImageContainer">
                </div>


                <input
                    type="file"
                    id="categoryImage"
                    accept="image/*"
                >


                <img
                    id="imagePreview"
                    class="new-image-preview"
                    alt="New image preview"
                >

            </div>


            <div
                id="formError"
                class="error-message">
            </div>


            <!-- Actions -->

            <div class="form-actions">

                <button
                    type="button"
                    id="cancelBtn"
                    class="cancel-btn">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="save-btn">

                    Save Category

                </button>

            </div>

        </form>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../supabase.js"></script>

<script src="admin-categories.js"></script>

</body>

</html>
